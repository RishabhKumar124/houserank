<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">HouseRank decision system map</title>
  <desc id="desc">A visual overview of how buyer context, candidate homes, deterministic scoring, AI research, and visit notes combine into ranked home decisions.</desc>
  <rect width="1280" height="640" rx="28" fill="#F8FAFC"/>
  <rect x="24" y="24" width="1232" height="592" rx="24" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2"/>
  <text x="72" y="82" fill="#0F172A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="800">HouseRank turns messy home search inputs into ranked decisions</text>
  <text x="72" y="118" fill="#475569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Built to show product judgment, AI boundaries, and practical field workflows in one system.</text>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M2 2L10 6L2 10V2Z" fill="#64748B"/>
    </marker>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.11"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="72" y="172" width="244" height="154" rx="14" fill="#ECFEFF" stroke="#06B6D4" stroke-width="2"/>
    <text x="100" y="213" fill="#0E7490" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800">Buyer Profile</text>
    <text x="100" y="248" fill="#164E63" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Budget and liquidity</text>
    <text x="100" y="275" fill="#164E63" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Family logistics</text>
    <text x="100" y="302" fill="#164E63" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Schools, safety, commute</text>

    <rect x="72" y="382" width="244" height="154" rx="14" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
    <text x="100" y="423" fill="#15803D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800">Candidate Homes</text>
    <text x="100" y="458" fill="#166534" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Listing links or manual data</text>
    <text x="100" y="485" fill="#166534" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Saved and visited states</text>
    <text x="100" y="512" fill="#166534" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Portable local backup</text>
  </g>

  <path d="M328 248H437" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M328 460H437" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="452" y="172" width="300" height="154" rx="14" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <text x="482" y="213" fill="#1D4ED8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800">Deterministic Baseline</text>
    <text x="482" y="248" fill="#1E3A8A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Transparent fit math</text>
    <text x="482" y="275" fill="#1E3A8A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Affordability caps</text>
    <text x="482" y="302" fill="#1E3A8A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Works without AI</text>

    <rect x="452" y="382" width="300" height="154" rx="14" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
    <text x="482" y="423" fill="#C2410C" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800">Tour Scorecard</text>
    <text x="482" y="458" fill="#7C2D12" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Noise, light, smell, layout</text>
    <text x="482" y="485" fill="#7C2D12" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Maintenance signals</text>
    <text x="482" y="512" fill="#7C2D12" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Notes captured during visits</text>
  </g>

  <path d="M764 248H873" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M764 460H873" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="888" y="172" width="320" height="154" rx="14" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
    <text x="918" y="213" fill="#6D28D9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800">Source-backed GPT Research</text>
    <text x="918" y="248" fill="#4C1D95" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Buying score and investment score</text>
    <text x="918" y="275" fill="#4C1D95" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Five-year low, mid, high scenarios</text>
    <text x="918" y="302" fill="#4C1D95" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Citations, risks, assumptions</text>

    <rect x="888" y="382" width="320" height="154" rx="14" fill="#FFF1F2" stroke="#F43F5E" stroke-width="2"/>
    <text x="918" y="423" fill="#BE123C" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800">Ranked Shortlist</text>
    <text x="918" y="458" fill="#881337" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Sort by personal fit or upside</text>
    <text x="918" y="485" fill="#881337" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Keep favorites and visit notes</text>
    <text x="918" y="512" fill="#881337" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Export decisions when needed</text>
  </g>

  <path d="M602 338V368" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1048 338V368" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="72" y="585" fill="#64748B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Privacy boundary: profiles and notes stay in browser storage. Server routes only receive bounded context when AI research runs.</text>
</svg>
